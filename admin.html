<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Control Panel | Gujrat Mushtarka Goods Transport Co.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0B2545;
  --gold: #F2B705;
  --light-bg: #F8FAFC;
  --border: #CBD5E1;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--light-bg);
  margin: 0;
  padding: 20px;
  color: #1E293B;
}

.container {
  max-width: 1150px;
  margin: 0 auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  border-top: 5px solid var(--navy);
}

.header-title {
  text-align: center;
  border-bottom: 2px solid var(--border);
  padding-bottom: 15px;
  margin-bottom: 25px;
}
.header-title h1 { color: var(--navy); margin: 0; font-size: 1.8rem; font-weight: 800; }
.header-title p { color: #64748B; margin: 5px 0 0; font-weight: 600; }

.auth-box {
  max-width: 400px;
  margin: 50px auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  border-top: 5px solid var(--gold);
  text-align: center;
}

label { font-weight: 600; font-size: 0.88rem; color: #334155; display: block; margin-bottom: 6px; text-align: left; }
input, select {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font: inherit;
  box-sizing: border-box;
  margin-bottom: 15px;
}

.btn {
  padding: 9px 16px;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-size: 0.88rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  text-decoration: none;
}
.btn-primary { background: var(--gold); color: var(--navy); }
.btn-navy { background: var(--navy); color: #fff; }
.btn-secondary { background: #64748B; color: #fff; }
.btn-danger { background: #EF4444; color: #fff; }

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #EFF6FF;
  padding: 12px 20px;
  border-radius: 8px;
  margin-bottom: 25px;
}

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 0.88rem; }
th { background: #F1F5F9; color: var(--navy); }

select.status-select {
  padding: 6px;
  border-radius: 4px;
  font-weight: 600;
  background: #FEF3C7;
  color: #D97706;
  border: 1px solid #F59E0B;
}
</style>
</head>
<body>

<!-- ADMIN LOGIN SECTION -->
<div id="adminAuthBox" class="auth-box">
  <h2 style="color:var(--navy); margin-top:0;">Admin Login</h2>
  <p style="color:#64748B; font-size:0.85rem;">Gujrat Mushtarka Control Panel</p>
  
  <div style="margin-bottom:15px;">
    <label>Admin Passcode</label>
    <input type="password" id="adminPassInput" placeholder="Enter Admin Passcode">
  </div>
  <button type="button" class="btn btn-primary" style="width:100%;" onclick="loginAdmin()">Login</button>
</div>

<!-- ADMIN DASHBOARD PANEL -->
<div id="adminDashboard" class="container" style="display:none;">
  <div class="header-title">
    <h1>GUJRAT MUSHTARKA GOODS TRANSPORT CO.</h1>
    <p>Admin Booking & Order Management Panel</p>
  </div>

  <div class="top-bar">
    <div>
      <strong>Live Customer Bookings</strong>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="index.html" class="btn btn-secondary">🏠 Home</a>
      <button class="btn btn-navy" onclick="loadAllBookings()">🔄 Refresh</button>
      <button class="btn btn-danger" onclick="logoutAdmin()">🚪 Logout</button>
    </div>
  </div>

  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Booking No.</th>
          <th>Sender Name & Contact</th>
          <th>Receiver Name, Contact & Address</th>
          <th>Destination</th>
          <th>Payment Mode</th>
          <th>Update Status</th>
        </tr>
      </thead>
      <tbody id="adminTableBody">
        <tr><td colspan="7" style="text-align:center;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Firebase Realtime Database SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsHjE5-6yoKjZG7mU7vKenvJtilvvXthg",
  authDomain: "gujrat-mushtarka-transport.firebaseapp.com",
  databaseURL: "https://gujrat-mushtarka-transport-default-rtdb.firebaseio.com",
  projectId: "gujrat-mushtarka-transport",
  storageBucket: "gujrat-mushtarka-transport.firebasestorage.app",
  messagingSenderId: "244664894427",
  appId: "1:244664894427:web:b54baa08d078d5ef499dfe"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.loginAdmin = function() {
  const pass = document.getElementById('adminPassInput').value;
  if(pass === "gujrat2001") {
    document.getElementById('adminAuthBox').style.display = 'none';
    document.getElementById('adminDashboard').style.display = 'block';
    loadAllBookings();
  } else {
    alert("Incorrect Passcode! Please enter valid admin passcode.");
  }
};

window.logoutAdmin = function() {
  document.getElementById('adminAuthBox').style.display = 'block';
  document.getElementById('adminDashboard').style.display = 'none';
  document.getElementById('adminPassInput').value = '';
};

window.loadAllBookings = async function() {
  const tbody = document.getElementById('adminTableBody');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Loading data...</td></tr>';
  
  try {
    const bookingsRef = ref(db, 'bookings');
    const snapshot = await get(bookingsRef);
    
    if(!snapshot.exists()) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No bookings found.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    snapshot.forEach(childSnap => {
      const bId = childSnap.key;
      const b = childSnap.val();
      
      const statuses = ["Booking Received", "Goods received", "In warehouse", "On the way", "Logistics partner warehouse", "Delivered"];
      let optionsHtml = '';
      statuses.forEach(st => {
        optionsHtml += `<option value="${st}" ${ (b.status || 'Booking Received') === st ? 'selected' : ''}>${st}</option>`;
      });

      tbody.innerHTML += `
        <tr>
          <td>${b.date}</td>
          <td><strong>${b.biltyNo}</strong></td>
          <td>
            <strong>${b.senderName}</strong><br>
            <small style="color:#64748B;">📞 ${b.userPhone || 'N/A'}</small>
          </td>
          <td>
            <strong>${b.receiverName}</strong><br>
            <small style="color:#2563EB;">📞 ${b.receiverPhone || 'N/A'}</small><br>
            <small style="color:#475569;">📍 ${b.receiverAddress || 'N/A'}</small>
          </td>
          <td><strong>${b.destCity}</strong></td>
          <td><strong style="color:${b.paymentMode === 'PAID' ? 'green' : 'blue'};">${b.paymentMode}</strong></td>
          <td>
            <select class="status-select" onchange="updateStatus('${bId}', this.value)">
              ${optionsHtml}
            </select>
          </td>
        </tr>
      `;
    });
  } catch(err) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Failed to load data: ' + err.message + '</td></tr>';
  }
};

window.updateStatus = async function(bId, newStatus) {
  try {
    await update(ref(db, 'bookings/' + bId), { status: newStatus });
    alert("Order status updated successfully!");
  } catch(err) {
    alert("Status update failed: " + err.message);
  }
};
</script>

</body>
</html>
