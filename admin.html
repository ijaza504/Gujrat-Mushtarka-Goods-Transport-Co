<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel | Gujrat Mushtarka Goods Transport Co.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0B2545;
  --gold: #F2B705;
  --light-bg: #F8FAFC;
  --border: #CBD5E1;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--light-bg);
  margin: 0;
  padding: 20px;
  color: #1E293B;
}

.urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2 !important; }

.container {
  max-width: 1150px;
  margin: 0 auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  border-top: 5px solid var(--navy);
}

.header-title {
  text-align: center;
  border-bottom: 2px solid var(--border);
  padding-bottom: 15px;
  margin-bottom: 25px;
}
.header-title h2 { color: var(--navy); margin: 0; }

.auth-box {
  max-width: 400px;
  margin: 50px auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  border-top: 5px solid var(--gold);
  text-align: center;
}

label { font-weight: 600; font-size: 0.88rem; color: #334155; display: block; margin-bottom: 6px; text-align: left; }
input, select {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font: inherit;
  box-sizing: border-box;
  margin-bottom: 15px;
}

.btn {
  padding: 10px 20px;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  border: none;
}
.btn-primary { background: var(--gold); color: var(--navy); width: 100%; }
.btn-navy { background: var(--navy); color: #fff; }

table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 0.88rem; }
th { background: #F1F5F9; color: var(--navy); }

select.status-select {
  padding: 6px;
  border-radius: 4px;
  font-weight: 600;
  background: #FEF3C7;
  color: #D97706;
}
</style>
</head>
<body>

<!-- ADMIN LOGIN SECTION -->
<div id="adminAuthBox" class="auth-box">
  <h3 class="urdu" style="color:var(--navy); margin-top:0;">ایڈمن لاگ ان</h3>
  <p style="color:#64748B; font-size:0.85rem;">Gujrat Mushtarka Control Panel</p>
  
  <div style="margin-bottom:15px;">
    <label>ایڈمن پاس کوڈ (Passcode)</label>
    <input type="password" id="adminPassInput" placeholder="پاس کوڈ درج کریں">
  </div>
  <button type="button" class="btn btn-primary" onclick="loginAdmin()">لاگ ان کریں</button>
</div>

<!-- ADMIN DASHBOARD PANEL -->
<div id="adminDashboard" class="container" style="display:none;">
  <div class="header-title">
    <h2 class="urdu">ایڈمن کنٹرول پینل - بکنگ مینجمنٹ</h2>
    <p>Gujrat Mushtarka Goods Transport Co.</p>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <strong>تمام کسٹمرز کی لائیو بکنگز</strong>
    <button class="btn btn-navy" onclick="loadAllBookings()">🔄 ریفریش کریں</button>
  </div>

  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>تاریخ</th>
          <th>بکنگ نمبر</th>
          <th>بھیجنے والا (Sender)</th>
          <th>وصول کنندہ تفاصیل (Receiver)</th>
          <th>منزل (Destination)</th>
          <th>ادائیگی</th>
          <th>اسٹیٹس (Status Update)</th>
        </tr>
      </thead>
      <tbody id="adminTableBody">
        <tr><td colspan="7" style="text-align:center;">ڈیٹا لوڈ ہو رہا ہے...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Firebase Realtime Database SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsHjE5-6yoKjZG7mU7vKenvJtilvvXthg",
  authDomain: "gujrat-mushtarka-transport.firebaseapp.com",
  databaseURL: "https://gujrat-mushtarka-transport-default-rtdb.firebaseio.com",
  projectId: "gujrat-mushtarka-transport",
  storageBucket: "gujrat-mushtarka-transport.firebasestorage.app",
  messagingSenderId: "244664894427",
  appId: "1:244664894427:web:b54baa08d078d5ef499dfe"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.loginAdmin = function() {
  const pass = document.getElementById('adminPassInput').value;
  if(pass === "gujrat2001") {
    document.getElementById('adminAuthBox').style.display = 'none';
    document.getElementById('adminDashboard').style.display = 'block';
    loadAllBookings();
  } else {
    alert("غلط پاس کوڈ! براہ کرم درست پاس کوڈ درج کریں۔");
  }
};

window.loadAllBookings = async function() {
  const tbody = document.getElementById('adminTableBody');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">ڈیٹا لوڈ ہو رہا ہے...</td></tr>';
  
  try {
    const bookingsRef = ref(db, 'bookings');
    const snapshot = await get(bookingsRef);
    
    if(!snapshot.exists()) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">کوئی نئی بکنگ موجود نہیں ہے۔</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    snapshot.forEach(childSnap => {
      const bId = childSnap.key;
      const b = childSnap.val();
      
      const statuses = ["Goods received", "In warehouse", "On the way", "Logistics partner warehouse", "Delivered"];
      let optionsHtml = '';
      statuses.forEach(st => {
        optionsHtml += `<option value="${st}" ${b.status === st ? 'selected' : ''}>${st}</option>`;
      });

      tbody.innerHTML += `
        <tr>
          <td>${b.date}</td>
          <td><strong>${b.biltyNo}</strong></td>
          <td>${b.senderName}<br><small style="color:#64748B;">${b.userEmail || ''}</small></td>
          <td>
            <strong>${b.receiverName}</strong><br>
            📞 ${b.receiverPhone || 'N/A'}<br>
            📍 <small>${b.receiverAddress || 'N/A'}</small>
          </td>
          <td>${b.destCity}</td>
          <td><strong style="color:${b.paymentMode === 'PAID' ? 'green' : 'blue'};">${b.paymentMode}</strong></td>
          <td>
            <select class="status-select" onchange="updateStatus('${bId}', this.value)">
              ${optionsHtml}
            </select>
          </td>
        </tr>
      `;
    });
  } catch(err) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">ڈیٹا لوڈ کرنے میں ناکامی: ' + err.message + '</td></tr>';
  }
};

window.updateStatus = async function(bId, newStatus) {
  try {
    await update(ref(db, 'bookings/' + bId), { status: newStatus });
    alert("اسٹیٹس کامیابی سے اپ ڈیٹ ہو گیا ہے!");
  } catch(err) {
    alert("اسٹیٹس اپ ڈیٹ کرنے میں مسئلہ آیا: " + err.message);
  }
};
</script>

</body>
</html>
