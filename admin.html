<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel | Gujrat Mushtarka Transport</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0F172A; color: #F8FAFC; margin: 0; padding: 20px; }
.container { max-width: 1100px; margin: 0 auto; background: #1E293B; padding: 25px; border-radius: 12px; }
h2 { color: #F2B705; margin-top: 0; }
.filter-bar { display: flex; gap: 15px; margin-bottom: 20px; background: #334155; padding: 15px; border-radius: 8px; }
select, input { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0F172A; color: #fff; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #334155; padding: 12px; text-align: left; }
th { background: #0F172A; color: #F2B705; }
.btn { padding: 6px 12px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; background: #F2B705; color: #0F172A; }
.login-box { max-width: 350px; margin: 100px auto; background: #1E293B; padding: 30px; border-radius: 12px; text-align: center; }
</style>
</head>
<body>

<div id="adminLogin" class="login-box">
  <h2>Admin Access</h2>
  <input type="password" id="adminKey" placeholder="Enter Admin Password" style="width:100%; box-sizing:border-box; margin-bottom:15px;">
  <button class="btn" style="width:100%;" onclick="checkAdmin()">Login to Panel</button>
</div>

<div id="adminPanel" class="container" style="display:none;">
  <h2>Management & Orders Control Panel</h2>
  
  <div class="filter-bar">
    <label>Filter Status: 
      <select id="filterStatus" onchange="filterBookings()">
        <option value="ALL">All Statuses</option>
        <option value="Goods received">Goods received</option>
        <option value="In warehouse">In warehouse</option>
        <option value="On the way">On the way</option>
        <option value="Logistics partner warehouse">Logistics partner warehouse</option>
        <option value="Delivered">Delivered</option>
      </select>
    </label>
  </div>

  <table>
    <thead>
      <tr>
        <th>Bilty No.</th>
        <th>Customer / Sender</th>
        <th>Receiver</th>
        <th>Destination</th>
        <th>Payment</th>
        <th>Current Status</th>
        <th>Update Status</th>
      </tr>
    </thead>
    <tbody id="adminTableBody">
      <tr><td colspan="7">Loading bookings...</td></tr>
    </tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsHjE5-6yoKjZG7mU7vKenvJtilvvXthg",
  authDomain: "gujrat-mushtarka-transport.firebaseapp.com",
  projectId: "gujrat-mushtarka-transport",
  storageBucket: "gujrat-mushtarka-transport.firebasestorage.app",
  messagingSenderId: "244664894427",
  appId: "1:244664894427:web:b54baa08d078d5ef499dfe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allBookings = [];

window.checkAdmin = function() {
  const pass = document.getElementById('adminKey').value;
  if(pass === "gujrat2001") { // Default Admin Password
    document.getElementById('adminLogin').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadAllBookings();
  } else {
    alert("Incorrect Admin Password!");
  }
};

async function loadAllBookings() {
  const tbody = document.getElementById('adminTableBody');
  tbody.innerHTML = '<tr><td colspan="7">Loading data...</td></tr>';
  
  try {
    const snap = await getDocs(collection(db, "bookings"));
    allBookings = [];
    snap.forEach(d => allBookings.push({ id: d.id, ...d.data() }));
    renderTable(allBookings);
  } catch(err) {
    tbody.innerHTML = '<tr><td colspan="7" style="color:red;">Error loading bookings!</td></tr>';
  }
}

function renderTable(list) {
  const tbody = document.getElementById('adminTableBody');
  tbody.innerHTML = '';
  if(list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7">No bookings found.</td></tr>';
    return;
  }

  list.forEach(b => {
    tbody.innerHTML += `
      <tr>
        <td><strong>${b.biltyNo}</strong><br><small>${b.date}</small></td>
        <td>${b.senderName}<br><small>${b.userEmail || ''}</small></td>
        <td>${b.receiverName}</td>
        <td>${b.destCity}</td>
        <td><strong>${b.paymentMode}</strong></td>
        <td><span style="color:#F2B705; font-weight:bold;">${b.status || 'Goods received'}</span></td>
        <td>
          <select id="status_${b.id}">
            <option value="Goods received" ${b.status === 'Goods received' ? 'selected' : ''}>Goods received</option>
            <option value="In warehouse" ${b.status === 'In warehouse' ? 'selected' : ''}>In warehouse</option>
            <option value="On the way" ${b.status === 'On the way' ? 'selected' : ''}>On the way</option>
            <option value="Logistics partner warehouse" ${b.status === 'Logistics partner warehouse' ? 'selected' : ''}>Logistics partner warehouse</option>
            <option value="Delivered" ${b.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
          </select>
          <button class="btn" onclick="updateStatus('${b.id}')">Save</button>
        </td>
      </tr>
    `;
  });
}

window.updateStatus = async function(docId) {
  const newStatus = document.getElementById(`status_${docId}`).value;
  try {
    await updateDoc(doc(db, "bookings", docId), { status: newStatus });
    alert("Status Updated Successfully!");
    loadAllBookings();
  } catch(err) {
    alert("Error updating status: " + err.message);
  }
};

window.filterBookings = function() {
  const status = document.getElementById('filterStatus').value;
  if(status === 'ALL') {
    renderTable(allBookings);
  } else {
    const filtered = allBookings.filter(b => (b.status || 'Goods received') === status);
    renderTable(filtered);
  }
};
</script>
</body>
</html>
